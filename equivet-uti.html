function lsGet(k,fb){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):fb; }catch{ return fb; } }
function lsSet(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch{} }
const LS_AVAL = "equivet_uti_avaliacoes_v1";

// ─── COMPONENTES ──────────────────────────────────────────────────────────────

function Badge({cor,children}){
  return <span style={{background:cor+"22",color:cor,border:"1px solid "+cor+"66",borderRadius:6,padding:"2px 8px",fontSize:11,fontWeight:700}}>{children}</span>;
}

function Alerta({tipo,children}){
  const cores = {danger:[C.red,"#3a0a0a"], warn:[C.amber,"#2a1e0a"], info:[C.blue,"#0a1e2a"]};
  const [c,bg] = cores[tipo]||cores.info;
  return <div style={{background:bg,border:"1px solid "+c+"55",borderRadius:8,padding:"10px 14px",marginBottom:10,fontSize:13,color:c,lineHeight:1.5}}>{children}</div>;
}

function EscoreWidget({escores,setEscores}){
  const total = ESCORES_CONFIG.reduce((s,e)=>s+(escores[e.id]||0),0);
  const maxTotal = ESCORES_CONFIG.length * 4;
  const risco = total <= 4 ? ["Estavel",C.green] : total <= 8 ? ["Atencao",C.amber] : total <= 12 ? ["Grave",C.red] : ["Critico",C.red];

  return(
    <div>
      {/* Total */}
      <div style={{background:C.card,border:"1px solid "+C.bord,borderRadius:12,padding:"14px 16px",marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
        <div>
          <div style={{fontSize:12,color:C.muted,marginBottom:4}}>ESCORE TOTAL</div>
          <div style={{fontSize:28,fontWeight:700,color:risco[1]}}>{total}<span style={{fontSize:14,color:C.dim}}>/{maxTotal}</span></div>
        </div>
        <div style={{textAlign:"right"}}>
          <Badge cor={risco[1]}>{risco[0]}</Badge>
          <div style={{fontSize:11,color:C.dim,marginTop:6}}>Atualizado agora</div>
        </div>
      </div>

      {ESCORES_CONFIG.map(esc=>{
        const val = escores[esc.id]||0;
        const opcaoAtual = esc.opcoes[val];
        return(
          <div key={esc.id} style={{background:C.card,border:"1px solid "+C.bord,borderRadius:10,padding:"12px 14px",marginBottom:10}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
              <div>
                <div style={{fontSize:13,fontWeight:700,color:C.text}}>{esc.nome}</div>
                <div style={{fontSize:11,color:C.dim}}>{esc.descricao}</div>
              </div>
              <Badge cor={opcaoAtual.cor}>{val}</Badge>
            </div>
            <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
              {esc.opcoes.map(op=>(
                <button key={op.val} onClick={()=>setEscores({...escores,[esc.id]:op.val})} style={{
                  background: val===op.val ? op.cor+"33" : "transparent",
                  border:"1px solid "+(val===op.val ? op.cor : C.bord),
                  borderRadius:8,padding:"6px 10px",cursor:"pointer",
                  fontSize:12,color:val===op.val?op.cor:C.muted,
                  fontWeight:val===op.val?700:400,
                  flex:"1 1 auto",minWidth:60,textAlign:"center",
                }}>{op.val}</button>
              ))}
            </div>
            <div style={{fontSize:11,color:opcaoAtual.cor,marginTop:6,paddingLeft:2}}>
              {opcaoAtual.label} — {opcaoAtual.desc}
            </div>
          </div>
        );
      })}

      {/* Alertas automaticos */}
      {total >= 13 && <Alerta tipo="danger">PACIENTE CRITICO — Acionar medidas de emergencia imediatas. Considerar suporte intensivo.</Alerta>}
      {escores.trc >= 3 && <Alerta tipo="danger">TRC critico — Choque circulatorio. Fluidoterapia agressiva imediata.</Alerta>}
      {escores.mucosa >= 3 && <Alerta tipo="danger">Mucosas toxicas — Endotoxemia grave. Plasma + fluidos + AINE urgente.</Alerta>}
      {escores.refluxo >= 4 && <Alerta tipo="danger">Refluxo critico ({">"}8L ou fetido) — Necrose intestinal / ruptura iminente. Cirurgia de emergencia.</Alerta>}
      {escores.refluxo === 3 && <Alerta tipo="warn">Refluxo intenso (5-8L) — Obstrucao de intestino delgado provavel. Manter sonda aberta. Avaliar indicacao cirurgica urgente.</Alerta>}
      {escores.refluxo === 2 && <Alerta tipo="info">Refluxo moderado (2-5L) — Repetir sondagem a cada 2h. Nao administrar fluidos orais.</Alerta>}
      {escores.motilidade >= 3 && <Alerta tipo="warn">Motilidade severamente reduzida — Ileus. Iniciar lidocaina IV continua.</Alerta>}
      {escores.dor >= 3 && <Alerta tipo="warn">Dor intensa — Revisar analgesia. Registrar hora e resposta ao tratamento.</Alerta>}
    </div>
  );
}

function HistoricoWidget({historico,onSalvar,escores}){
  const [nota,setNota] = useState("");
  const salvar = () => {
    const reg = {
      hora: new Date().toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"}),
      data: new Date().toLocaleDateString("pt-BR"),
      escores:{...escores},
      total: ESCORES_CONFIG.reduce((s,e)=>s+(escores[e.id]||0),0),
      nota: nota.trim()
    };
    onSalvar(reg);
    setNota("");
  };

  return(
    <div>
      <div style={{background:C.card,border:"1px solid "+C.bord,borderRadius:10,padding:"12px 14px",marginBottom:12}}>
        <div style={{fontSize:12,color:C.muted,marginBottom:6}}>Observacao (opcional)</div>
        <textarea value={nota} onChange={e=>setNota(e.target.value)} placeholder="Ex: refluxo 3L, inicio lidocaina, primeira evacuacao..." style={{...IS,minHeight:60,resize:"none",fontSize:13}}/>
        <button onClick={salvar} style={{background:C.red,color:"#fff",border:"none",borderRadius:8,padding:"9px",cursor:"pointer",fontSize:13,fontWeight:700,width:"100%",marginTop:8}}>
          Registrar avaliacao agora
        </button>
      </div>

      {historico.length===0 && <div style={{color:C.dim,fontSize:13,padding:"12px 0"}}>Nenhuma avaliacao registrada ainda.</div>}
      {[...historico].reverse().map((r,i)=>{
        const risco = r.total<=4?"Estavel":r.total<=8?"Atencao":r.total<=12?"Grave":"Critico";
        const cor = r.total<=4?C.green:r.total<=8?C.amber:C.red;
        return(
          <div key={i} style={{background:C.card,border:"1px solid "+C.bord,borderRadius:10,padding:"10px 14px",marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:4}}>
              <div style={{fontSize:12,color:C.muted}}>{r.data} {r.hora}</div>
              <Badge cor={cor}>{risco} ({r.total})</Badge>
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:r.nota?6:0}}>
              {ESCORES_CONFIG.map(e=>(
                <span key={e.id} style={{fontSize:11,color:C.dim}}>{e.nome.split(" ")[0]}: <span style={{color:C.text,fontWeight:700}}>{r.escores[e.id]||0}</span></span>
              ))}
            </div>
            {r.nota&&<div style={{fontSize:12,color:C.amber,marginTop:4,fontStyle:"italic"}}>"{r.nota}"</div>}
          </div>
        );
      })}
    </div>
  );
}

function ProtocoloCard({protocolo}){
  const [aberto,setAberto] = useState(false);
  const [feitos,setFeitos] = useState({});
  const total = protocolo.passos.length;
  const done  = Object.values(feitos).filter(Boolean).length;

  return(
    <div style={{background:C.card,border:"1px solid "+C.bord,borderRadius:12,marginBottom:10,overflow:"hidden"}}>
      <div onClick={()=>setAberto(!aberto)} style={{padding:"14px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",touchAction:"manipulation"}}>
        <div style={{flex:1}}>
          <div style={{fontSize:14,fontWeight:700,color:C.text}}>{protocolo.nome}</div>
          <div style={{fontSize:11,color:done===total&&total>0?C.green:C.dim,marginTop:3}}>
            {done}/{total} etapas {done===total&&total>0?"concluidas":""}
          </div>
        </div>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          {done>0&&<div style={{width:36,height:6,background:C.bord,borderRadius:3,overflow:"hidden"}}>
            <div style={{width:(done/total*100)+"%",height:"100%",background:done===total?C.green:C.amber,borderRadius:3,transition:"width 0.3s"}}/>
          </div>}
          <span style={{color:C.muted,fontSize:18}}>{aberto?"▲":"▼"}</span>
        </div>
      </div>
      {aberto&&<div style={{borderTop:"1px solid "+C.bord,padding:"4px 0 12px"}}>
        {protocolo.passos.map((passo,i)=>{
          const linhas = passo.split("\n");
          const principal = linhas[0];
          const detalhe = linhas.slice(1).join("\n");
          const isAlert = principal.startsWith("ATENCAO")||principal.startsWith("NAO ")||principal.startsWith("URGENCIA")||principal.startsWith("OBRIGATORIO");
          return(
            <div key={i} onClick={()=>setFeitos({...feitos,[i]:!feitos[i]})}
              style={{display:"flex",gap:12,padding:"10px 16px",cursor:"pointer",background:feitos[i]?"#0a1a0a":"transparent",borderLeft:"3px solid "+(feitos[i]?C.green:isAlert?C.red:"transparent"),transition:"all 0.15s",touchAction:"manipulation"}}>
              <div style={{width:22,height:22,borderRadius:6,border:"2px solid "+(feitos[i]?C.green:C.bord),background:feitos[i]?C.green:"transparent",flexShrink:0,marginTop:1,display:"flex",alignItems:"center",justifyContent:"center"}}>
                {feitos[i]&&<span style={{color:"#0a0e1a",fontSize:14,fontWeight:900}}>✓</span>}
              </div>
              <div style={{flex:1}}>
                <div style={{fontSize:13,color:feitos[i]?C.dim:isAlert?C.red:C.text,textDecoration:feitos[i]?"line-through":"none",lineHeight:1.4,fontWeight:isAlert?700:400}}>
                  {principal}
                </div>
                {detalhe&&!feitos[i]&&<div style={{fontSize:12,color:C.dim,marginTop:4,lineHeight:1.5,fontStyle:"italic"}}>{detalhe}</div>}
              </div>
            </div>
          );
        })}
        {done===total&&total>0&&<div style={{margin:"8px 16px 0",background:"#0a2a0a",border:"1px solid #3a6a3a",borderRadius:8,padding:"8px 12px",fontSize:13,color:C.green,textAlign:"center"}}>
          ✓ Protocolo concluido
        </div>}
      </div>}
    </div>
  );
}

// ─── APP PRINCIPAL ─────────────────────────────────────────────────────────────

function App(){
  const [fase,setFase]         = useState("campo");
  const [aba,setAba]           = useState("protocolos"); // protocolos | escores | historico
  const [diagnostico,setDiag]  = useState("");
  const [paciente,setPac]      = useState("");
  const [escores,setEscores]   = useState({});
  const [historico,setHistorico] = useState([]);

  useEffect(()=>{
    setHistorico(lsGet(LS_AVAL,[]));
  },[]);

  const salvarAvaliacao = (reg) => {
    const novo = [...historico, {...reg,paciente,fase}];
    setHistorico(novo);
    lsSet(LS_AVAL,novo);
  };

  const limparHistorico = () => {
    if(window.confirm("Limpar todo o historico de avaliacoes?")){ setHistorico([]); lsSet(LS_AVAL,[]); }
  };

  const faseAtual = PROTOCOLOS[fase];
  const total = ESCORES_CONFIG.reduce((s,e)=>s+(escores[e.id]||0),0);
  const riscoGeral = total<=4?[C.green,"Estavel"]:total<=8?[C.amber,"Atencao"]:[C.red,total<=12?"Grave":"Critico"];

  const FASES = [
    {id:"campo",  label:"Campo",   icon:"🚨", cor:C.red},
    {id:"preop",  label:"Pre-op",  icon:"🏥", cor:C.amber},
    {id:"posop",  label:"Pos-op",  icon:"⚡", cor:C.blue},
    {id:"alta",   label:"Alta",    icon:"🌿", cor:C.green},
  ];

  return(
    <div style={{fontFamily:"Georgia,serif",background:C.bg,minHeight:"100vh",color:C.text}}>

      {/* HEADER */}
      <div style={{background:"linear-gradient(180deg,#131828,#0a0e1a)",borderBottom:"1px solid "+C.bord,padding:"14px 16px 0",position:"sticky",top:0,zIndex:10}}>
        <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
          <span style={{fontSize:26}}>🏇</span>
          <div style={{flex:1}}>
            <div style={{fontSize:17,fontWeight:700,color:C.red}}>EquiVet UTI</div>
            <div style={{fontSize:10,color:C.dim,textTransform:"uppercase",letterSpacing:"0.08em"}}>Colica Cirurgica — Pre e Pos-Operatorio</div>
          </div>
          {total>0&&<Badge cor={riscoGeral[0]}>{riscoGeral[1]}</Badge>}
        </div>

        {/* Input paciente */}
        <input placeholder="Nome do paciente..." value={paciente} onChange={e=>setPac(e.target.value)} style={{...IS,marginBottom:10,fontSize:13}}/>

        {/* Fases */}
        <div style={{display:"flex",gap:0,overflowX:"auto"}}>
          {FASES.map(f=>(
            <button key={f.id} onClick={()=>setFase(f.id)} style={{
              background:fase===f.id?f.cor+"22":"transparent",
              color:fase===f.id?f.cor:C.muted,
              border:"none",borderBottom:fase===f.id?"2px solid "+f.cor:"2px solid transparent",
              padding:"8px 14px",cursor:"pointer",fontSize:12,fontWeight:fase===f.id?700:400,
              whiteSpace:"nowrap",flexShrink:0,
            }}>{f.icon} {f.label}</button>
          ))}
        </div>
      </div>

      <div style={{padding:"16px"}}>

        {/* Cabecalho da fase */}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:16,fontWeight:700,color:faseAtual.cor}}>{faseAtual.icon} {faseAtual.titulo}</div>
          <div style={{fontSize:12,color:C.dim}}>{faseAtual.subtitulo}</div>
        </div>

        {/* Diagnostico */}
        <div style={{marginBottom:14}}>
          <div style={{fontSize:11,color:C.muted,textTransform:"uppercase",letterSpacing:"0.08em",marginBottom:6}}>Diagnostico principal</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {faseAtual.diagnosticos.map(d=>(
              <button key={d} onClick={()=>setDiag(d===diagnostico?"":d)} style={{
                background:diagnostico===d?faseAtual.cor+"22":"transparent",
                color:diagnostico===d?faseAtual.cor:C.muted,
                border:"1px solid "+(diagnostico===d?faseAtual.cor:C.bord),
                padding:"5px 12px",borderRadius:16,cursor:"pointer",fontSize:12,
              }}>{d}</button>
            ))}
          </div>
        </div>

        {/* Sub-abas */}
        <div style={{display:"flex",gap:0,borderBottom:"1px solid "+C.bord,marginBottom:16}}>
          {[["protocolos","Protocolos"],["escores","Escores"],["historico","Historico"]].map(([id,label])=>(
            <button key={id} onClick={()=>setAba(id)} style={{
              background:"transparent",color:aba===id?faseAtual.cor:C.muted,
              border:"none",borderBottom:aba===id?"2px solid "+faseAtual.cor:"2px solid transparent",
              padding:"8px 16px",cursor:"pointer",fontSize:13,fontWeight:aba===id?700:400,
            }}>{label}</button>
          ))}
        </div>

        {/* PROTOCOLOS */}
        {aba==="protocolos"&&<div>
          {faseAtual.protocolos
            .filter(p => {
              if(!diagnostico) return true;
              const nome = p.nome.toLowerCase();
              const diag = diagnostico.toLowerCase();
              if(diag.includes("deslocamento") && nome.includes("hernia")) return false;
              if((diag.includes("hernia")||diag.includes("encarceramento")) && nome.includes("deslocamento")) return false;
              return true;
            })
            .map((p,i)=><ProtocoloCard key={i} protocolo={p}/>)
          }
        </div>}

        {/* ESCORES */}
        {aba==="escores"&&<EscoreWidget escores={escores} setEscores={setEscores}/>}

        {/* HISTORICO */}
        {aba==="historico"&&<div>
          <HistoricoWidget historico={historico} onSalvar={salvarAvaliacao} escores={escores}/>
          {historico.length>0&&<button onClick={limparHistorico} style={{background:"transparent",color:C.dim,border:"1px solid "+C.bord,borderRadius:8,padding:"7px 14px",cursor:"pointer",fontSize:12,marginTop:8}}>Limpar historico</button>}
        </div>}

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(App));
</script>
<script>
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  }
</script>
</body>
</html>
